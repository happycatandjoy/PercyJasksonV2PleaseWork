<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camp Half-Blood: V3</title>
<style>
body{background:#101820;color:#fff;font-family:Georgia,serif;max-width:900px;margin:auto;padding:20px}
h1{text-align:center}
button{display:block;width:100%;padding:15px;margin:8px 0;font-size:18px;border:none;border-radius:10px;background:#3a6ea5;color:#fff;cursor:pointer}
button:hover{background:#4f86c6}
input{width:100%;padding:12px;margin-bottom:10px;font-size:18px}
#story{font-size:22px;line-height:1.6;margin-bottom:20px;min-height:180px}
.small{font-size:15px;opacity:.8}
</style>
</head>
<body>

<h1>🏕️ Camp Half-Blood: The Prophecy V3</h1>

<div id="story"></div>
<div id="choices"></div>

<script>
let game={
name:"",
parent:"",
companion:"",
courage:0,
wisdom:0,
friendship:0,
chaos:0,
secrets:0,
improvise:false,
lastAction:"",
npcMemory:{},
actionMemory:[]
};

const story=document.getElementById("story");
const choices=document.getElementById("choices");

function remember(action){
game.lastAction=action;
game.actionMemory.push(action);
}

function npcRemember(npc,item){
if(!game.npcMemory[npc]) game.npcMemory[npc]=[];
game.npcMemory[npc].push(item);
}

function show(t){story.innerHTML=t;}
function choice(arr){
choices.innerHTML="";
arr.forEach(o=>{
const b=document.createElement("button");
b.textContent=o.text;
b.onclick=o.action;
choices.appendChild(b);
});
}

window.onload=characterCreator;

function characterCreator(){
show("<h2>Create Your Demigod</h2>");
choices.innerHTML=`
<input id="playerName" placeholder="Enter Your Name">
<button onclick="chooseParent('Poseidon')">🔱 Poseidon</button>
<button onclick="chooseParent('Athena')">🦉 Athena</button>
<button onclick="chooseParent('Apollo')">☀️ Apollo</button>
<button onclick="chooseParent('Hades')">💀 Hades</button>
<button onclick="chooseParent('Hermes')">👜 Hermes</button>
<button onclick="chooseParent('Ares')">⚔️ Ares</button>
`;
}

function chooseParent(parent){
game.parent=parent;
game.name=document.getElementById("playerName").value||"Demigod";
chapterOne();
}

function chapterOne(){
show(`
<h2>Chapter 1: Claimed</h2>
Welcome ${game.name}. Child of ${game.parent}.
What do you do?
`);
choice([
{text:"⚔️ Raise your weapon",action:()=>{game.courage++;remember("weapon");chapterOneReaction();}},
{text:"🧠 Study everyone",action:()=>{game.wisdom++;remember("observe");chapterOneReaction();}},
{text:"😂 Ask for cookies",action:()=>{game.chaos++;remember("cookies");chapterOneReaction();}},
{text:"💙 Greet campers",action:()=>{game.friendship++;remember("friends");chapterOneReaction();}}
]);
}

function chapterOneReaction(){
let text="";

if(game.lastAction==="weapon"){
text='Clarisse grins. "Not scared, huh?"';
npcRemember("Clarisse","brave");
}

if(game.lastAction==="observe"){
text='Annabeth notices your caution.';
npcRemember("Annabeth","careful");
}

if(game.lastAction==="cookies"){
text='The Hermes cabin immediately adopts you.';
npcRemember("Hermes Cabin","funny");
}

if(game.lastAction==="friends"){
text='Several campers remember your kindness.';
npcRemember("Campers","friendly");
}

show(text);
choice([{text:"Continue",action:chapterTwo}]);
}

function chapterTwo(){
show(`
<h2>Chapter 2: The Missing Pegasus</h2>
Chiron chooses you for a quest.

🔒 IMPROVISE can now be learned.
`);

choice([
{text:"🦉 Annabeth",action:()=>{game.companion="Annabeth";chapterTwoSkill();}},
{text:"🐐 Grover",action:()=>{game.companion="Grover";chapterTwoSkill();}},
{text:"💀 Nico",action:()=>{game.companion="Nico";chapterTwoSkill();}},
{text:"⚔️ Alone",action:()=>{game.companion="Nobody";chapterTwoSkill();}}
]);
}

function chapterTwoSkill(){
show(`
${game.companion} agrees to help.

A satyr teaches a risky quest skill.

Unlock IMPROVISE?
`);

choice([
{text:"✨ Learn IMPROVISE",action:()=>{
game.improvise=true;
remember("improvise unlock");
pegasusQuest();
}},
{text:"Skip Training",action:pegasusQuest}
]);
}

function pegasusQuest(){
show(`
You and ${game.companion} enter the woods.

How do you investigate?
`);
let opts=[
{text:"🌲 Follow tracks",action:()=>{game.courage++;remember("tracks");chapterThree();}},
{text:"🕵️ Look for clues",action:()=>{game.wisdom++;remember("clues");chapterThree();}},
{text:"🍪 Snack break",action:()=>{game.chaos++;remember("snack");chapterThree();}}
];

if(game.improvise){
opts.push({
text:"✨ IMPROVISE",
action:()=>{
game.wisdom++;
game.chaos++;
remember("improvise");
chapterThree();
}
});
}

choice(opts);
}

function chapterThree(){
let mem="";

if(game.npcMemory.Annabeth) mem+="Annabeth still remembers your first impression.<br>";
if(game.npcMemory.Clarisse) mem+="Clarisse expects courage from you.<br>";

show(`
<h2>Chapter 3: The Titan Symbol</h2>
${mem}
A symbol of Kronos is carved into a tree.
`);

choice([
{text:"📣 Tell Chiron",action:()=>{game.wisdom++;chapterFour();}},
{text:"🕶️ Investigate Alone",action:()=>{game.secrets++;chapterFour();}},
{text:"⚔️ Rally Camp",action:()=>{game.courage++;chapterFour();}},
{text:"✨ Fake a trap",action:()=>{game.chaos++;chapterFour();}}
]);
}

function chapterFour(){
let reaction="";

if(game.lastAction==="improvise"){
reaction="Your improvised tactics already have a reputation.";
}

show(`
<h2>Chapter 4: Medusa's Garden</h2>
${reaction}
A mysterious woman welcomes you.
`);

choice([
{text:"🛡️ Use reflections",action:()=>{game.wisdom+=2;ending();}},
{text:"⚔️ Attack",action:()=>{game.courage+=2;ending();}},
{text:"🍔 Ask for food",action:()=>{game.chaos+=2;ending();}},
{text:"🤝 Negotiate",action:()=>{game.friendship+=2;ending();}}
]);
}

function ending(){
let title="💙 TRUE FRIEND";

if(game.wisdom>=3) title="📜 CHILD OF PROPHECY";
else if(game.courage>=3) title="🏆 HERO OF OLYMPUS";
else if(game.secrets>=2) title="👑 CHAMPION OF KRONOS";
else if(game.chaos>=3) title="🍪 LORD OF BLUE COOKIES";

show(`
<h2>${title}</h2>

Name: ${game.name}<br>
Parent: ${game.parent}<br>
Companion: ${game.companion}<br><br>

⚔️ Courage: ${game.courage}<br>
🧠 Wisdom: ${game.wisdom}<br>
💙 Friendship: ${game.friendship}<br>
😂 Chaos: ${game.chaos}<br>
👑 Secrets: ${game.secrets}<br><br>

Unlocked Skill: ${game.improvise?"IMPROVISE":"None"}<br>
Last Action: ${game.lastAction}<br><br>

<div class="small">
CHAPTER 5 TEASER<br><br>
The Traitor knows your name.<br>
Someone at Camp Half-Blood has been feeding information to Kronos.<br>
A stolen prophecy points toward the Labyrinth.<br>
Your choices and remembered actions may return.
</div>
`);
choices.innerHTML="";
}
</script>
</body>
</html>
<script>
game.improvise=false;
game.lastAction="";
game.actionMemory=[];
game.npcMemory={};

function remember(action){
game.lastAction=action;
game.actionMemory.push(action);
}

function npcRemember(npc,item){
if(!game.npcMemory[npc]) game.npcMemory[npc]=[];
game.npcMemory[npc].push(item);
}

/* CHAPTER 2 IMPROVISE UNLOCK */

function addImproviseChoice(options){
if(game.improvise){
options.push({
text:"✨ IMPROVISE",
action:function(){
game.wisdom++;
game.chaos++;
remember("improvise");
chapterThree();
}
});
}
return options;
}

/* MORE REACTIONS */

function getReaction(){
if(game.lastAction==="weapon") return 'Clarisse: "Still fearless."';
if(game.lastAction==="observe") return 'Annabeth watches you carefully.';
if(game.lastAction==="cookies") return 'Hermes Cabin cheers.';
if(game.lastAction==="friends") return 'Campers greet you by name.';
if(game.lastAction==="improvise") return 'Your legend is spreading.';
return "";
}

/* NPC MEMORY */

npcRemember("Annabeth","smart");
npcRemember("Clarisse","brave");
npcRemember("Grover","kind");

/* ACTION MEMORY CALLBACKS */

const recentActions=game.actionMemory.slice(-3).join(", ");

/* CHAPTER 5 TEASER */

const chapter5Teaser=`
<hr>
<h3>Chapter 5: The Traitor</h3>
Someone remembers everything you did.
NPC alliances will carry over.
Old actions may unlock hidden routes.
A traitor walks among the demigods.
`;
</script>
